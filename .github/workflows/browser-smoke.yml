name: Browser simulation diagnostics

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm ci

      - name: Run integration audit
        run: npm run audit:integration

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.62.0
          npx playwright install --with-deps chromium

      - name: Build production site
        run: npm run build

      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/reality-preview.log 2>&1 &
          echo $! > /tmp/reality-preview.pid
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/reality-preview.log
          exit 1

      - name: Verify iPhone sphere aspect
        id: iphone_sphere_test
        continue-on-error: true
        env:
          REALITY_BASE_URL: http://127.0.0.1:4173/
          REALITY_IPHONE_ARTIFACT_DIR: artifacts/iphone-sphere-smoke
        run: node scripts/iphone-sphere-smoke.cjs

      - name: Run unified runtime diagnostics
        id: unified_test
        continue-on-error: true
        env:
          REALITY_BASE_URL: http://127.0.0.1:4173/
          REALITY_UNIFIED_ARTIFACT_DIR: artifacts/unified-smoke
          REALITY_REQUIRE_REBOUND: "0"
        run: node scripts/unified-smoke.cjs

      - name: Verify Pixi simulation root
        id: root_renderer_test
        continue-on-error: true
        env:
          REALITY_BASE_URL: http://127.0.0.1:4173/
          REALITY_ROOT_RENDERER_ARTIFACT_DIR: artifacts/root-renderer-smoke
        run: node scripts/root-renderer-smoke.cjs

      - name: Enter, move through, and exit surface mode
        id: surface_mode_test
        continue-on-error: true
        env:
          REALITY_BASE_URL: http://127.0.0.1:4173/
          REALITY_SURFACE_MODE_ARTIFACT_DIR: artifacts/surface-mode-smoke
        run: node scripts/surface-mode-smoke.cjs

      - name: Verify plant-to-motile evolution
        id: origin_life_test
        continue-on-error: true
        env:
          REALITY_BASE_URL: http://127.0.0.1:4173/
          REALITY_ORIGIN_LIFE_ARTIFACT_DIR: artifacts/origin-motile-life-smoke
        run: node scripts/origin-motile-life-smoke.cjs

      - name: Verify evolution inspector
        id: evolution_inspector_test
        continue-on-error: true
        env:
          REALITY_BASE_URL: http://127.0.0.1:4173/
          REALITY_EVOLUTION_INSPECTOR_ARTIFACT_DIR: artifacts/evolution-inspector-smoke
        run: node scripts/evolution-inspector-smoke.cjs

      - name: Verify v48 morphogenesis inheritance scaling
        id: morphogenesis_test
        continue-on-error: true
        env:
          REALITY_BASE_URL: http://127.0.0.1:4173/
          REALITY_MORPHOGENESIS_ARTIFACT_DIR: artifacts/morphogenesis-smoke
        run: node scripts/morphogenesis-performance-smoke.cjs

      - name: Verify v48 body-plan history
        id: morphogenesis_history_test
        continue-on-error: true
        env:
          REALITY_BASE_URL: http://127.0.0.1:4173/
          REALITY_MORPHOGENESIS_HISTORY_ARTIFACT_DIR: artifacts/morphogenesis-history-smoke
        run: node scripts/morphogenesis-history-smoke.cjs

      - name: Verify v50 sensory brains
        id: sensory_brains_test
        continue-on-error: true
        env:
          REALITY_BASE_URL: http://127.0.0.1:4173/
          REALITY_SENSORY_BRAINS_ARTIFACT_DIR: artifacts/sensory-brains-v50-smoke
        run: node scripts/sensory-brains-v50-smoke.cjs

      - name: Verify v51 social signaling
        id: social_signaling_test
        continue-on-error: true
        env:
          REALITY_BASE_URL: http://127.0.0.1:4173/
          REALITY_SOCIAL_SIGNALING_ARTIFACT_DIR: artifacts/social-signaling-v51-smoke
        run: node scripts/social-signaling-v51-smoke.cjs

      - name: Verify v52 learning and memory
        id: learning_memory_test
        continue-on-error: true
        env:
          REALITY_BASE_URL: http://127.0.0.1:4173/
          REALITY_LEARNING_MEMORY_ARTIFACT_DIR: artifacts/learning-memory-v52-smoke
        run: node scripts/learning-memory-v52-smoke.cjs

      - name: Verify v53 proto-culture
        id: proto_culture_test
        continue-on-error: true
        env:
          REALITY_BASE_URL: http://127.0.0.1:4173/
          REALITY_PROTO_CULTURE_ARTIFACT_DIR: artifacts/proto-culture-v53-smoke
        run: node scripts/proto-culture-v53-smoke.cjs

      - name: Verify v54 proto-language
        id: proto_language_test
        continue-on-error: true
        env:
          REALITY_BASE_URL: http://127.0.0.1:4173/
          REALITY_PROTO_LANGUAGE_ARTIFACT_DIR: artifacts/proto-language-v54-smoke
        run: node scripts/proto-language-v54-smoke.cjs

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reality-browser-diagnostics-${{ github.sha }}
          path: |
            artifacts/unified-smoke
            artifacts/root-renderer-smoke
            artifacts/iphone-sphere-smoke
            artifacts/surface-mode-smoke
            artifacts/origin-motile-life-smoke
            artifacts/evolution-inspector-smoke
            artifacts/morphogenesis-smoke
            artifacts/morphogenesis-history-smoke
            artifacts/sensory-brains-v50-smoke
            artifacts/social-signaling-v51-smoke
            artifacts/learning-memory-v52-smoke
            artifacts/proto-culture-v53-smoke
            artifacts/proto-language-v54-smoke
            /tmp/reality-preview.log
          if-no-files-found: warn
          retention-days: 30

      - name: Publish browser status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const unified = '${{ steps.unified_test.outcome }}';
            const rootRenderer = '${{ steps.root_renderer_test.outcome }}';
            const iphoneSphere = '${{ steps.iphone_sphere_test.outcome }}';
            const surfaceMode = '${{ steps.surface_mode_test.outcome }}';
            const originLife = '${{ steps.origin_life_test.outcome }}';
            const inspector = '${{ steps.evolution_inspector_test.outcome }}';
            const morphogenesis = '${{ steps.morphogenesis_test.outcome }}';
            const morphHistory = '${{ steps.morphogenesis_history_test.outcome }}';
            const sensoryBrains = '${{ steps.sensory_brains_test.outcome }}';
            const socialSignaling = '${{ steps.social_signaling_test.outcome }}';
            const learningMemory = '${{ steps.learning_memory_test.outcome }}';
            const protoCulture = '${{ steps.proto_culture_test.outcome }}';
            const protoLanguage = '${{ steps.proto_language_test.outcome }}';
            const parts = {
              'browser/iphone-sphere': iphoneSphere,
              'browser/unified-core': unified,
              'browser/root-renderer': rootRenderer,
              'browser/surface-mode': surfaceMode,
              'browser/origin-life': originLife,
              'browser/evolution-inspector': inspector,
              'browser/morphogenesis': morphogenesis,
              'browser/morph-history': morphHistory,
              'browser/v50-sensory-brains': sensoryBrains,
              'browser/v51-social-signaling': socialSignaling,
              'browser/v52-learning-memory': learningMemory,
              'browser/v53-proto-culture': protoCulture,
              'browser/v54-proto-language': protoLanguage,
            };
            for (const [contextName, outcome] of Object.entries(parts)) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: outcome === 'success' ? 'success' : 'failure',
                context: contextName,
                description: `${contextName.replace('browser/', '')}: ${outcome}`.slice(0, 140),
                target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions`,
              });
            }
            const ok = Object.values(parts).every(outcome => outcome === 'success');
            const detail = `iPhone:${iphoneSphere} unified:${unified} root:${rootRenderer} surface:${surfaceMode} origin:${originLife} inspector:${inspector} morph:${morphogenesis} history:${morphHistory} brain:${sensoryBrains} social:${socialSignaling} memory:${learningMemory} culture:${protoCulture} language:${protoLanguage}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'browser/unified-runtime',
              description: ok ? 'All living-planet browser checks passed' : detail.slice(0, 140),
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions`,
            });
