name: Agent interaction smoke

on:
  pull_request:
    paths:
      - 'core/agent-interaction-bridge.js'
      - 'index.html'
      - 'scripts/agent-interaction-smoke.cjs'
      - '.github/workflows/agent-interaction-smoke.yml'
  workflow_dispatch:

concurrency:
  group: agent-interaction-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-mouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.62.0
          npx playwright install --with-deps chromium

      - name: Build production site
        run: npm run build

      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/reality-preview.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/reality-preview.log
          exit 1

      - name: Grab, drag, zoom, and click globe with real mouse
        env:
          REALITY_BASE_URL: http://127.0.0.1:4173/
          REALITY_AGENT_INTERACTION_ARTIFACT_DIR: artifacts/agent-interaction-smoke
        run: node scripts/agent-interaction-smoke.cjs

      - name: Upload interaction proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-interaction-${{ github.sha }}
          path: |
            artifacts/agent-interaction-smoke
            /tmp/reality-preview.log
          if-no-files-found: warn
          retention-days: 30
